<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/vite.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Vite App</title>
    </head>
    <body class="bg-white">
        <div id="app">
            <canvas id="canvas"></canvas>

            <div class="fixed right-[10px] bottom-[10px] flex gap-2">
                <button
                    id="start"
                    class="bg-purple-500 text-white px-4 py-2 rounded-sm text-sm cursor-pointer"
                >
                    Start
                </button>
                <button
                    id="stop"
                    class="bg-red-500 text-white px-4 py-2 rounded-sm text-sm cursor-pointer"
                >
                    Stop
                </button>
            </div>
        </div>
        <script type="module" src="/src/main.js"></script>
    </body>
</html>
