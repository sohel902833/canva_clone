<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/vite.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Vite App</title>
    </head>
    <body class="bg-gray-300">
        <div id="app" class="flex items-center justify-center h-screen">
            <canvas
                id="canvas"
                class="border border-slate-400 rounded-3xl bg-white"
                width="600"
                height="600"
            ></canvas>

            <div class="fixed right-0 bottom-0 flex items-center gap-2">
                <button
                    id="start_button"
                    class="bg-amber-700 text-white px-2 py-1 rounded-sm cursor-pointer"
                >
                    Start
                </button>
                <button
                    id="stop_button"
                    class="bg-red-700 text-white px-2 py-1 rounded-sm cursor-pointer"
                >
                    Stop
                </button>
            </div>
        </div>
        <script type="module" src="/src/main.js"></script>
    </body>
</html>
